[package]
name = "noctalia-spotify-backend"
version = "0.1.0"
edition = "2021"
description = "Native Spotify Connect backend for Noctalia using librespot"

[dependencies]
librespot = { git = "https://github.com/librespot-org/librespot", tag = "v0.4.2" }
tokio = { version = "1.38", features = ["full", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "migrate"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["serde", "v4", "v7"] }
async-channel = "2.0"
lazy_static = "1.4"
url = "2.5"
base64 = "0.22"
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors"] }
tokio-stream = "0.1"
futures = "0.3"
rand = "0.8"
sha2 = "0.10"

# Force specific versions to avoid conflicts
cpal = "0.13"
rodio = "0.14"
vergen = "9.1.0"
vergen-lib = "0.1.6"

# librespot engine dependencies
sha1 = "0.10"
hex = "0.4"