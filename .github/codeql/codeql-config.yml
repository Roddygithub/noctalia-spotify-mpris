name: "CodeQL Config"

# Disable default queries and use security-focused ones
disable-default-queries: true

queries:
  - uses: security-and-quality
  - uses: security-extended

# Exclude test files and generated code
paths-ignore:
  - "**/target/**"
  - "**/tests/**"
  - "**/*_test.rs"
  - "**/test_*.rs"

# Only analyze main source files
paths:
  - "backend/src/**"
  - "*.py"