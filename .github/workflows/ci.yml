name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  lint-luau:
    name: Lint Luau
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install selene
        run: |
          curl -sL -o selene.zip https://github.com/Kampfkarren/selene/releases/download/0.27.0/selene-0.27.0-linux.zip
          unzip -o selene.zip -d selene-bin
          chmod +x selene-bin/selene
          sudo mv selene-bin/selene /usr/local/bin/selene
          selene --version

      - name: Lint Luau files
        run: selene service.luau widget.luau panel.luau

  check-python:
    name: Check Python bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python3 -m py_compile spotify_backend_bridge.py

  check-toml:
    name: Validate plugin.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install taplo
        run: |
          curl -sL -o taplo.gz https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz
          gunzip -f taplo.gz
          chmod +x taplo
          sudo mv taplo /usr/local/bin/taplo
          taplo --version

      - name: Check TOML syntax
        run: taplo check plugin.toml

  build-backend:
    name: Build Rust backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Print Rust version
        run: rustc --version && cargo --version

      - name: Check formatting
        run: cd backend && cargo fmt --check

      - name: Clippy version
        run: cargo clippy --version

      - name: Clippy
        run: cd backend && cargo clippy -- -D warnings --message-format=json 2>&1 | tee clippy-output.json || true

      - name: Check clippy output
        run: |
          if [ -f backend/clippy-output.json ]; then
            cat backend/clippy-output.json | jq -r 'select(.reason=="compiler-message") | "\(.message.spans[0].file_name):\(.message.spans[0].line_start):\(.message.spans[0].column_start): \(.message.message) [\(.message.code.code)]"' || true
          fi

      - name: Build
        run: cd backend && cargo build --release
        timeout-minutes: 15

      - name: Verify binary
        run: test -x backend/target/release/noctalia-spotify-backend && file backend/target/release/noctalia-spotify-backend

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: noctalia-spotify-backend
          path: backend/target/release/noctalia-spotify-backend
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-

      - name: Run cargo audit
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cd backend && cargo audit

  test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [build-backend]
    steps:
      - uses: actions/checkout@v4

      - name: Download backend binary
        uses: actions/download-artifact@v4
        with:
          name: noctalia-spotify-backend
          path: backend/target/release/

      - name: Make binary executable
        run: chmod +x backend/target/release/noctalia-spotify-backend

      - name: Run basic validation
        run: |
          test -f plugin.toml
          test -f service.luau
          test -f widget.luau
          test -f panel.luau
          test -f spotify_backend_bridge.py
          test -f README.md
          test -f LICENSE
          test -f backend/target/release/noctalia-spotify-backend
          echo "All required files present"

      - name: Test Python bridge syntax
        run: python3 -m py_compile spotify_backend_bridge.py

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build-backend, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: noctalia-spotify-mpris:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create Release
    needs: [lint-luau, check-python, check-toml, build-backend, security-audit, test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download backend binary
        uses: actions/download-artifact@v4
        with:
          name: noctalia-spotify-backend
          path: dist/

      - name: Create release archive
        run: |
          cd dist
          tar -czf noctalia-spotify-mpris-${{ github.ref_name }}.tar.gz \
            plugin.toml service.luau widget.luau panel.luau \
            spotify_backend_bridge.py README.md LICENSE \
            noctalia-spotify-backend \
            backend/systemd/noctalia-spotify-backend.service \
            backend/scripts/build-backend.sh

      - name: Generate checksums
        run: |
          cd dist
          sha256sum noctalia-spotify-mpris-${{ github.ref_name }}.tar.gz > noctalia-spotify-mpris-${{ github.ref_name }}.tar.gz.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/noctalia-spotify-mpris-${{ github.ref_name }}.tar.gz
            dist/noctalia-spotify-mpris-${{ github.ref_name }}.tar.gz.sha256
          generate_release_notes: true
          draft: false
          prerelease: false