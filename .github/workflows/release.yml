name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            backend/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build backend
        run: cd backend && cargo build --release
        timeout-minutes: 15

      - name: Verify binary
        run: test -x backend/target/release/noctalia-spotify-backend && file backend/target/release/noctalia-spotify-backend

      - name: Run cargo audit
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cd backend && cargo audit

      - name: Create release archive
        run: |
          mkdir -p release
          tar -czf release/noctalia-spotify-mpris-${{ github.ref_name }}.tar.gz \
            plugin.toml service.luau widget.luau panel.luau \
            spotify_backend_bridge.py README.md LICENSE \
            backend/target/release/noctalia-spotify-backend \
            backend/systemd/noctalia-spotify-backend.service \
            backend/scripts/build-backend.sh

      - name: Generate checksums
        run: |
          cd release
          sha256sum noctalia-spotify-mpris-${{ github.ref_name }}.tar.gz > noctalia-spotify-mpris-${{ github.ref_name }}.tar.gz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/noctalia-spotify-mpris-${{ github.ref_name }}.tar.gz
            release/noctalia-spotify-mpris-${{ github.ref_name }}.tar.gz.sha256
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' || false }}