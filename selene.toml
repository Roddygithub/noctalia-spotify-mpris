# Selene configuration for Noctalia Spotify MPRIS plugin

std = "luau"

# Global allowances
allow_defined = true
allow_increment = true
allow_mixed_table = true
allow_shadow = true
allow_unused = true

# Specific rules
[Rules]
# Disable rules that are too strict for our codebase
undefined_variable = "off"
global_usage = "off"
unscoped_variables = "off"
unused_variable = "off"
shadowing = "off"
mixed_table = "off"
incomplete_signature = "off"
duplicate_keys = "off"
roblox_globals = "off"
global_mutation = "off"
empty_table = "off"
unsupported_library = "off"
incompatible_library = "off"
unreachable_code = "off"
uninitialized_variable = "off"

# Enable useful checks
undefined_global = "warn"
unused_label = "warn"
invalid_escape = "warn"
unbalanced_assignments = "warn"
wrong_argument_count = "warn"
wrong_argument_type = "warn"
index_type_mismatch = "warn"
field_type_mismatch = "warn"
property_type_mismatch = "warn"
argument_type_mismatch = "warn"
return_type_mismatch = "warn"

# LSP settings
[LSP]
hover = true
completion = true
definition = true
references = true
diagnostics = true
document_symbols = true
workspace_symbols = true
code_actions = true
rename = true