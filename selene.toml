# Selene configuration for Noctalia Spotify MPRIS plugin

std = "luau"

# Disable rules that are too strict for this codebase
[lints]
undefined_variable = "allow"
global_usage = "allow"
unscoped_variables = "allow"
unused_variable = "allow"
shadowing = "allow"
mixed_table = "allow"
incomplete_signature = "allow"
duplicate_keys = "allow"
roblox_globals = "allow"
global_mutation = "allow"
empty_table = "allow"
unsupported_library = "allow"
incompatible_library = "allow"
unreachable_code = "allow"
uninitialized_variable = "allow"
undefined_global = "allow"
unused_label = "allow"
invalid_escape = "allow"
unbalanced_assignments = "allow"
wrong_argument_count = "allow"
wrong_argument_type = "allow"
index_type_mismatch = "allow"
field_type_mismatch = "allow"
property_type_mismatch = "allow"
argument_type_mismatch = "allow"
return_type_mismatch = "allow"
incorrect_standard_library_use = "allow"
empty_if = "allow"
multiple_statements = "allow"